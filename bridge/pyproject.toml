[project]
name = "memorymark-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mempalace",
    "fastapi",
    "uvicorn",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
# Silence DeprecationWarnings emitted from inside uvicorn's import of the
# legacy `websockets` server module — they are upstream-owned and can't be
# fixed here. Scoped narrowly so warnings from our own code still surface.
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning:websockets.legacy",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated.*:DeprecationWarning:uvicorn.protocols.websockets.websockets_impl",
]
